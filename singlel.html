<body>
    <h1>Arrays + Single for Loop</h1>
<h3>Count Even Numbers</h3>
<script>

function fun(num){
    let count=0
    for(i=0;i<num.length;i++){
        if(num[i]%2==0){
            count++
        }
    }
    return count
}
let func=fun([2, 5, 8, 9, 10])
console.log(func)

</script>
<h2>3</h2>
